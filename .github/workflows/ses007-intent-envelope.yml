name: SES-007 Intent Envelope Verification

on:
  push:
    paths:
      - 'sessions/SES-007/**'
      - '.github/workflows/ses007-intent-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sessions/SES-007
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile intent_envelope.py test_intent_envelope.py
      - name: Unit tests
        run: python -m unittest test_intent_envelope.py -v
