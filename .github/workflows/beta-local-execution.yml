name: Beta local execution

on:
  push:
    branches: [main]
  pull_request:

jobs:
  local-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run local execution boundary test
        run: python -m pytest -q tests/test_local_executor_beta.py
