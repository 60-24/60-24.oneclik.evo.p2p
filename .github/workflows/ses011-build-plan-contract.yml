name: SES-011 BuildPlan Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run SES-011 contract tests
        run: python -m pytest sessions/SES-011/test_build_plan_contract.py -v
      - name: Run SES-013 provenance boundary test
        run: python -m pytest sessions/SES-013/test_build_plan_provenance.py -v
      - name: Run SES-014 human approval boundary test
        run: python -m pytest sessions/SES-014/test_human_approval_boundary.py -v
      - name: Run SES-015 approval-to-plan binding test
        run: python -m pytest sessions/SES-015/test_approval_plan_binding.py -v
      - name: Run SES-017 execution-request contract test
        run: python -m pytest sessions/SES-017/test_execution_request_contract.py -v

# SES-017 CI evidence gate: authorization must produce an explicit execution request without execution.
