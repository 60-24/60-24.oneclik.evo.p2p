name: SES-043 P2P proof

on:
  push:
    branches: [main]
  pull_request:

jobs:
  two-node-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: |
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Run SES-043 two-node proof
        run: python -m pytest -q sessions/SES-043/test_p2p_two_nodes.py
