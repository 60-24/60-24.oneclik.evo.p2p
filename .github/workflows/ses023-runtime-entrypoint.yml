name: SES-023 Runtime Entry Point Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run SES-023 RED contract test
        run: python -m pytest sessions/SES-023/test_runtime_entrypoint_contract.py -v
