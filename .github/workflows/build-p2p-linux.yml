name: P2P Linux executable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-p2p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip pyinstaller pytest
          python -m pip install -r requirements.txt
      - name: Run P2P regression tests
        run: |
          python -m pytest -q sessions/SES-046/test_minikernel_handshake.py
          python -m pytest -q sessions/SES-047/test_lifecycle_protocol.py
          python -m pytest -q sessions/SES-049/test_message_delivery.py
          python -m pytest -q sessions/SES-055/test_bidirectional_identity.py
          python -m pytest -q sessions/SES-058/test_non_loopback_ipv4.py
          python -m pytest -q sessions/SES-059/test_cli_errors.py
          python -m pytest -q sessions/SES-061/test_incomplete_handshake_timeout.py
          python -m pytest -q sessions/SES-064/test_identity_transport_binding.py
          python -m pytest -q sessions/SES-065/test_persistent_identity.py
          python -m pytest -q sessions/SES-067/test_frame_size_limit.py
      - name: Build Linux executable
        run: python -m PyInstaller --onefile --name P2P60-24Node --paths . demo/p2p_node_cli.py
      - name: Package artifact
        run: tar -czf P2P60-24Node-linux-x86_64.tar.gz -C dist P2P60-24Node
      - name: Smoke test packaged two-node executable
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          tar -xzf P2P60-24Node-linux-x86_64.tar.gz -C "$test_dir"
          cd "$test_dir"
          ./P2P60-24Node --listen 127.0.0.1:39001 --node-id B >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          response="$(./P2P60-24Node --connect 127.0.0.1:39001 --node-id A --message hello-from-A)"
          test "$response" = "pong-from-B"
          wait "$server_pid"
          grep -q "node B received from A" server.log
          grep -q "hello-from-A" server.log
          ./P2P60-24Node --listen 0.0.0.0:39002 --node-id B >lan-server.log 2>&1 &
          lan_server_pid=$!
          trap 'kill "$server_pid" "$lan_server_pid" 2>/dev/null || true' EXIT
          sleep 1
          lan_host="$(python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.connect(("1.1.1.1", 80)); print(s.getsockname()[0]); s.close()')"
          case "$lan_host" in 127.*) echo "no non-loopback IPv4 address"; exit 1;; esac
          lan_response="$(./P2P60-24Node --connect "$lan_host:39002" --node-id A --message lan-check)"
          test "$lan_response" = "pong-from-B"
          wait "$lan_server_pid"
          grep -q "node B received from A" lan-server.log
          grep -q "lan-check" lan-server.log
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2P60-24Node-linux-x86_64
          path: P2P60-24Node-linux-x86_64.tar.gz
