name: SES-034 System Builder entrypoint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run SES-034 entrypoint test
        run: python -m pytest -q sessions/SES-034/test_system_builder_entrypoint.py
