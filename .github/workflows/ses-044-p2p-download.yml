name: SES-044 standalone P2P proof

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone-two-node-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run standalone two-node proof
        run: python -m pytest -q sessions/SES-044/test_downloadable_two_nodes.py
