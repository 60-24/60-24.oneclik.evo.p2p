name: P2P trusted introductions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-introductions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: |
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Run trusted introductions proof
        run: python -m pytest -q tests/test_trusted_introductions.py
