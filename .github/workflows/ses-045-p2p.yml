name: SES-045 concrete P2P node

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concrete-node-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run SES-045 concrete node API proof
        run: python -m pytest -q sessions/SES-045/test_p2p_node_api.py

  ses-046-handshake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run SES-046 handshake proof
        run: python -m pytest -q sessions/SES-046/test_minikernel_handshake.py

  ses-047-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run SES-047 lifecycle and malformed protocol proof
        run: python -m pytest -q sessions/SES-047/test_lifecycle_protocol.py

  ses-049-linux-message-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run SES-049 message delivery proof
        run: python -m pytest -q sessions/SES-049/test_message_delivery.py
