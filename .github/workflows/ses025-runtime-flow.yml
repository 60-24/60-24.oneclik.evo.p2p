name: SES-025 Runtime Flow Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run SES-025 runtime flow contract tests
        run: python -m pytest sessions/SES-025/test_runtime_flow_contract.py -v
      - name: Run SES-027 canonical runtime evidence proof
        run: python -m pytest sessions/SES-027/test_runtime_evidence_contract.py -v
